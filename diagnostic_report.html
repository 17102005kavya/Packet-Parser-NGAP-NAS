<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGAP/NAS Diagnostic Report - tests/sample_capture.json</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-surface: #0f1629;
            --card-bg: rgba(19, 29, 53, 0.75);
            --card-hover: rgba(28, 42, 74, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --indigo: #6366f1;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --cyan: #06b6d4;
            --font-ui: 'Outfit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-ui);
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-sub { font-size: 0.85rem; color: var(--text-muted); }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .mcard { background: var(--card-bg); border: 1px solid var(--card-border); padding: 1.25rem; border-radius: 14px; position: relative; overflow: hidden; }
        .mcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .mblue::before { background: var(--indigo); }
        .mcyan::before { background: var(--cyan); }
        .mred::before { background: var(--rose); }
        .mamber::before { background: var(--amber); }
        .mval { font-size: 2rem; font-weight: 700; font-family: var(--font-code); }
        .mlbl { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

        .ue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.25rem; }
        .ue-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; cursor: pointer; transition: all 0.2s ease; }
        .ue-card:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.4); background: var(--card-hover); }
        .badge { font-family: var(--font-code); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 6px; }
        .badge-ran { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
        .badge-amf { background: rgba(6, 182, 212, 0.15); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.3); }
        .pill { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 20px; }
        .pill-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .pill-failed { background: rgba(244, 63, 94, 0.2); color: #fca5a5; border: 1px solid rgba(244, 63, 94, 0.4); }
        .pill-incomplete { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; padding: 2rem; z-index: 1000; }
        .modal-overlay.hidden { display: none; }
        .modal-box { background: var(--bg-surface); border: 1px solid var(--card-border); border-radius: 18px; width: 100%; max-width: 850px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-hdr { padding: 1.25rem; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; }
        
        .seq-row { display: grid; grid-template-columns: 80px 1fr; gap: 1rem; align-items: center; font-family: var(--font-code); font-size: 0.82rem; padding: 0.4rem 0; }
        .seq-msg { background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 8px; padding: 0.6rem 0.9rem; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>📡 NGAP / NAS 5G Diagnostic Report</h1>
                <div class="header-sub">Standalone Diagnostic Export for: <strong>tests/sample_capture.json</strong></div>
            </div>
            <div>
                <span class="badge badge-ran">Generated via Antigravity Diagnostic Engine</span>
            </div>
        </header>

        <section class="metrics-grid">
            <div class="mcard mblue">
                <div class="mlbl">Total Frames</div>
                <div class="mval">6</div>
            </div>
            <div class="mcard mcyan">
                <div class="mlbl">Identified UEs</div>
                <div class="mval">1</div>
            </div>
            <div class="mcard mred">
                <div class="mlbl">Explicit Failures</div>
                <div class="mval" id="cnt-failed">0</div>
            </div>
            <div class="mcard mamber">
                <div class="mlbl">Incomplete</div>
                <div class="mval" id="cnt-inc">0</div>
            </div>
        </section>

        <main id="ue-grid" class="ue-grid"></main>
    </div>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-hdr">
                <h3 id="modal-title">UE Context Signalling Flow</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        const reportData = {"pcap_file": "tests/sample_capture.json", "total_frames_analyzed": 6, "malformed_frames_skipped": 0, "global_observations": [], "ng_setup_procedures": [], "sctp_events": [], "ue_contexts": [{"context_id": "UE_1", "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "gnb_ip": "192.168.1.10", "amf_ip": "192.168.1.50", "procedures": [{"name": "Registration", "status": "Completed", "start_time": 100.0, "end_time": 100.5, "last_observed_msg": "Registration Accept", "expected_next_msg": null, "failure_cause": null, "evidence": [], "observations": ["Registration completed successfully."], "events_frames": [1, 2, 3, 4, 5, 6]}, {"name": "Authentication", "status": "Completed", "start_time": 100.1, "end_time": 100.2, "last_observed_msg": "Authentication Response", "expected_next_msg": null, "failure_cause": null, "evidence": [], "observations": ["Authentication Successful"], "events_frames": [2, 3]}, {"name": "Security Mode", "status": "Completed", "start_time": 100.3, "end_time": 100.4, "last_observed_msg": "Security Mode Complete", "expected_next_msg": null, "failure_cause": null, "evidence": [], "observations": ["Security Completed"], "events_frames": [4, 5]}], "explicit_failures": [], "incomplete_procedures": [], "diagnostic_observations": ["NG Setup completed successfully.", "Identifier continuity maintained.", "No protocol anomalies detected."], "timeline": [{"frame_number": 1, "timestamp": "100.0", "protocol": "NGAP", "direction": "gNB -> AMF", "message_type": "Registration Request", "procedure_code": "14", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": null, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.10", "dst_ip": "192.168.1.50", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}, {"frame_number": 2, "timestamp": "100.1", "protocol": "NGAP", "direction": "AMF -> gNB", "message_type": "Authentication Request", "procedure_code": "15", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.50", "dst_ip": "192.168.1.10", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}, {"frame_number": 3, "timestamp": "100.2", "protocol": "NGAP", "direction": "gNB -> AMF", "message_type": "Authentication Response", "procedure_code": "16", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.10", "dst_ip": "192.168.1.50", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}, {"frame_number": 4, "timestamp": "100.3", "protocol": "NGAP", "direction": "AMF -> gNB", "message_type": "Security Mode Command", "procedure_code": "15", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.50", "dst_ip": "192.168.1.10", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}, {"frame_number": 5, "timestamp": "100.4", "protocol": "NGAP", "direction": "gNB -> AMF", "message_type": "Security Mode Complete", "procedure_code": "16", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.10", "dst_ip": "192.168.1.50", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}, {"frame_number": 6, "timestamp": "100.5", "protocol": "NGAP", "direction": "AMF -> gNB", "message_type": "Registration Accept", "procedure_code": "15", "cause_code": null, "ran_ue_ngap_id": 15, "amf_ue_ngap_id": 302, "fiveg_s_tmsi": null, "pdu_session_id": null, "src_ip": "192.168.1.50", "dst_ip": "192.168.1.10", "src_port": 38412, "dst_port": 38412, "sctp_stream": 1}]}], "diagnostic_observations": []};

        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });

        function renderDashboard() {
            const grid = document.getElementById('ue-grid');
            grid.innerHTML = '';

            let failed = 0;
            let inc = 0;

            (reportData.ue_contexts || []).forEach(ue => {
                const hasFail = (ue.explicit_failures && ue.explicit_failures.length > 0);
                const hasInc = (ue.incomplete_procedures && ue.incomplete_procedures.length > 0);

                if (hasFail) failed++;
                else if (hasInc) inc++;

                let pillCls = 'pill-success';
                let pillTxt = 'Completed';
                if (hasFail) { pillCls = 'pill-failed'; pillTxt = 'Explicit Failure 🔴'; }
                else if (hasInc) { pillCls = 'pill-incomplete'; pillTxt = 'Incomplete 🟡'; }

                const card = document.createElement('div');
                card.className = 'ue-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <strong style="font-family:var(--font-code); color:var(--indigo); font-size:1.1rem;">${ue.context_id}</strong>
                            <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
                                <span class="badge badge-ran">RAN ID: ${ue.ran_ue_ngap_id}</span>
                                <span class="badge badge-amf">AMF ID: ${ue.amf_ue_ngap_id}</span>
                            </div>
                        </div>
                        <span class="pill ${pillCls}">${pillTxt}</span>
                    </div>
                    <div style="font-size:0.82rem; color:var(--text-muted);">
                        gNB: ${ue.gnb_ip || '192.168.1.10'} | AMF: ${ue.amf_ip || '192.168.1.50'}
                    </div>
                    ${hasFail ? `<div style="background:rgba(244,63,94,0.1); border:1px solid rgba(244,63,94,0.3); padding:0.6rem; border-radius:8px; color:#fca5a5; font-size:0.8rem;">🚨 ${ue.explicit_failures[0].procedure} (${ue.explicit_failures[0].cause})</div>` : ''}
                `;
                card.onclick = () => openModal(ue);
                grid.appendChild(card);
            });

            document.getElementById('cnt-failed').textContent = failed;
            document.getElementById('cnt-inc').textContent = inc;
        }

        function openModal(ue) {
            document.getElementById('modal-title').textContent = `${ue.context_id} Signalling Sequence Flow`;
            const body = document.getElementById('modal-body');
            body.innerHTML = '';

            (ue.timeline || []).forEach(evt => {
                const row = document.createElement('div');
                row.className = 'seq-row';
                const isGnb = (evt.direction || '').includes('gNB -> AMF');
                row.innerHTML = `
                    <div style="color:var(--text-muted); font-size:0.75rem;">Frame #${evt.frame_number}</div>
                    <div class="seq-msg">
                        <div>
                            <strong>${evt.message_type}</strong>
                            <div style="color:var(--text-muted); font-size:0.75rem;">${evt.src_ip || 'gNB'} ➔ ${evt.dst_ip || 'AMF'}</div>
                            ${evt.cause_code ? `<div style="color:#fca5a5; font-size:0.75rem;">Cause: ${evt.cause_code}</div>` : ''}
                        </div>
                        <span style="font-weight:600; color:${isGnb ? '#a5b4fc' : '#67e8f9'};">${evt.direction}</span>
                    </div>
                `;
                body.appendChild(row);
            });

            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
